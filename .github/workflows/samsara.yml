name: samsara.exe

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samsara:
    runs-on: ubuntu-latest
    steps:
      - uses: AdolfLecompte/samsara-exe@v1
        with:
          fx: floyd
          palette: win95
          dot: 3
          layout: landscape
          name_style: shade
          name_deco: columns
          timezone: "America/Bogota"
