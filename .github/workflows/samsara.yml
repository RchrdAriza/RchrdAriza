name: samsara.exe

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samsara:
    runs-on: ubuntu-latest
    steps:
      - uses: RchrdAriza/samsara-exe@v1
        with:
          fx: atkinson
          palette: win95
          dot: 3
          timezone: "America/Bogota"
